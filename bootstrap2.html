<html>
<head>
<title>Bootstrap Example</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Feature 1: Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Feature 2: Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Feature 1: Animate.css (animations) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>

<body>

<div class="container-fluid">
    <h1>KLE TECHNOLOGICAL UNIVERSITY! <i class="bi bi-emoji-smile"></i></h1>

     <h1 class="animate__animated animate__bounce">COMPUTER SCIENCE ENGINEERING</h1>

    <p>Resize the browser window to see the effect</p>

    <p>The columns will automatically stack on the top of each other when the screen is less than 768px</p>

    <div class="row">
        <div class="col-sm-2" style="background-color:lavender;">
            .col-sm-2 <i class="fa-solid fa-star"></i>
        </div>

        <div class="col-sm-6" style="background-color:lavenderblush;">
            <p>KLE TECH <i class="bi bi-mortarboard"></i></p>
        </div>

        <div class="col-sm-4" style="background-color:lavender;">
            .col-sm-4 <i class="fa-solid fa-heart"></i>
        </div>
    </div>

</div>

</body>
</html>
